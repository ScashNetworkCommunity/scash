bled by default (-blocksxor=1 / DEFAULT_BLOCKS_XOR = true).\";   echo \"- TRUC (v3) transactions, 1P1C package relay, and Pay-to-Anchor (P2A) enabled while keeping opt-in RBF (-mempoolfullrbf=0 default).\";   echo \"- Legacy single-string warnings RPC output preserved by default alongside JSON-RPC 2.0 updates.\";   echo \"- Fresh Windows installs default to \%LOCALAPPDATA\%\\\\Scash (AppData\\\\Local\\\\Scash) while preserving existing AppData\\\\Roaming\\\\Scash folders.\";   echo \"- Security backports included for CVE-2024-35202, CVE-2024-52919 (part 2), CVE-2024-52911, CVE-2025-54604, CVE-2025-54605, CVE-2025-46598, and CVE-2025-46597.\";   echo \"- Build System & Toolchain Updates: Linux x86_64 binaries continue to be built on Ubuntu 22.04 LTS (glibc 2.35) for broad distro compatibility while Windows 64-bit cross-compilation and CI verification are upgraded to Ubuntu 24.04 LTS. Includes Clang 18 and GCC 13/14 C++20 static linking fixes (inline base_blob::SetHex in src/uint256.h and -include cstdint in depends/packages/randomx.mk).\"; } > doc/release-notes/scash/release-notes-2.1.0.md; git add -A; if git rev-parse --verify f97a13b >/dev/null 2>&1; then git reset --soft f97a13b; fi; git commit --author=\"iscpuminingreal <234070532+iscpuminingreal@users.noreply.github.com>\" -m \"Release Scash v2.1.0 (upgrade to Bitcoin Core v28.4)\" \vert{}\vert{} true; git push -f origin HEAD:scash_master; git tag -f scash_v2.1.0-narnia-core-28.4.0 HEAD; git push -f origin refs/tags/scash_v2.1.0-narnia-core-28.4.0"}]},"package-linux":{"needs":["finalize-repo"],"runs-on":"ubuntu-22.04","env":{"GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"steps":[{"uses":"actions/checkout@v4","with":{"ref":"scash_master"}},{"name":"Cache Linux depends","uses":"actions/cache@v4","with":{"path":"depends/built\ndepends/sources\ndepends/x86_64-pc-linux-gnu","key":"scash-v28-depends-linux-full-v2","restore-keys":"scash-v28-depends-linux-full-\nscash-v28-depends-noqt"}},{"run":"if ! grep -q \"case ChainTyp