name: Upgrade Scash Core v27.0 to v28.4

on:
  push:
      branches:
            - scash-28.4-narnia
                paths:
                      - '.github/workflows/upgrade-to-v28.4.yml'
                        workflow_dispatch:

                        permissions:
                          contents: write

                          jobs:
                            upgrade-scash-v28:
                                runs-on: ubuntu-22.04
                                    steps:
                                          - name: Checkout Scash Repository
                                                  uses: actions/checkout@v4
                                                          with:
                                                                    ref: scash_master
                                                                              fetch-depth: 0

                                                                                    - name: Merge Bitcoin Core v28.4 and Apply Scash Decisions
                                                                                            run: |
                                                                                                      set -uo pipefail
                                                                                                                TARGET_TAG="v28.4"
                                                                                                                          NEW_BRANCH="scash-28.4-narnia"
                                                                                                                          
                                                                                                                                    git config user.name "iscpuminingreal"
                                                                                                                                              git config user.email "iscpuminingreal@users.noreply.github.com"
                                                                                                                                              
                                                                                                                                                        git remote add bitcoin-upstream https://github.com/bitcoin/bitcoin.git || true
                                                                                                                                                                  git fetch bitcoin-upstream \
                                                                                                                                                                              "refs/tags/v27.0:refs/tags/v27.0" \
                                                                                                                                                                                          "refs/tags/${TARGET_TAG}:refs/tags/${TARGET_TAG}" \
                                                                                                                                                                                                      "refs/pull/31112/head:refs/remotes/bitcoin-upstream/pr-31112" \
                                                                                                                                                                                                                  "refs/pull/32604/head:refs/remotes/bitcoin-upstream/pr-32604" \
                                                                                                                                                                                                                              "refs/pull/33105/head:refs/remotes/bitcoin-upstream/pr-33105" \
                                                                                                                                                                                                                                          "refs/pull/32473/head:refs/remotes/bitcoin-upstream/pr-32473" \
                                                                                                                                                                                                                                                      --no-tags
                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                MERGE_BASE="$(git merge-base HEAD v27.0)"
                                                                                                                                                                                                                                                                          git checkout -B "${NEW_BRANCH}"
                                                                                                                                                                                                                                                                                    git merge --no-commit --no-ff "${TARGET_TAG}" || true
                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                              if git status --porcelain | grep -q "libbitcoinconsensus.pc.in"; then
                                                                                                                                                                                                                                                                                                          git rm -f libbitcoinconsensus.pc.in || true
                                                                                                                                                                                                                                                                                                                    fi
                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                              CONFLICTS="$(git diff --name-only --diff-filter=U || true)"
                                                                                                                                                                                                                                                                                                                                        {
                                                                                                                                                                                                                                                                                                                                                    echo "# Scash v27.0 -> ${TARGET_TAG} Automated Merge Report"
                                                                                                                                                                                                                                                                                                                                                                echo ""
                                                                                                                                                                                                                                                                                                                                                                            echo "- Base Commit: $(git rev-parse HEAD)"
                                                                                                                                                                                                                                                                                                                                                                                        echo "- v27.0 Merge Base: ${MERGE_BASE}"
                                                                                                                                                                                                                                                                                                                                                                                                    echo "- Target Tag: ${TARGET_TAG}"
                                                                                                                                                                                                                                                                                                                                                                                                                echo ""
                                                                                                                                                                                                                                                                                                                                                                                                                            if [[ -n "${CONFLICTS}" ]]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                          echo "## Conflicting Files"
                                                                                                                                                                                                                                                                                                                                                                                                                                                        for f in ${CONFLICTS}; do
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        echo "- \`${f}\`"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      done
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    echo ""
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  echo "## Conflict Details"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                for f in ${CONFLICTS}; do
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if [[ -f "${f}" ]]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  echo "### \`${f}\`"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    echo '```cpp'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      grep -n -C 8 -E '^(<<<<<<<|=======|>>>>>>>)' "${f}" || true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        echo '```'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          echo ""
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        done
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    else
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  echo "## Clean Merge"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                echo "Zero merge conflicts!"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } > UPGRADE_CONFLICTS_REPORT.md
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if [[ -f "src/node/blockstorage.h" ]]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            sed -i 's/DEFAULT_BLOCKS_XOR{false}/DEFAULT_BLOCKS_XOR{true}/g' src/node/blockstorage.h
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if [[ -f "src/kernel/mempool_options.h" ]]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            sed -i 's/DEFAULT_MEMPOOL_FULL_RBF{true}/DEFAULT_MEMPOOL_FULL_RBF{false}/g' src/kernel/mempool_options.h
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      elif [[ -f "src/validation.h" ]]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  sed -i 's/DEFAULT_MEMPOOL_FULL_RBF = true/DEFAULT_MEMPOOL_FULL_RBF = false/g' src/validation.h
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      for rpc_file in src/rpc/blockchain.cpp src/rpc/mining.cpp src/rpc/net.cpp; do
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if [[ -f "${rpc_file}" ]]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                sed -i 's/IsDeprecatedRPCEnabled("warnings")/!node.args.IsArgNegated("-deprecatedrpc") \&\& (node.args.GetArgs("-deprecatedrpc").empty() || IsDeprecatedRPCEnabled("warnings"))/g' "${rpc_file}" || true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      done
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if [[ -f "doc/README_windows_scash.md" ]]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            sed -i 's/AppData\\Roaming\\Scash/AppData\\Local\\Scash/g' doc/README_windows_scash.md
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        sed -i 's/%APPDATA%\\Scash/%LOCALAPPDATA%\\Scash/g' doc/README_windows_scash.md
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if [[ -f "src/validation.cpp" ]]; then
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        perl -0777 -i -pe 's/(CCheckQueueControl<CScriptCheck>\s+control\([^;]+;\s*\n)(\s*std::vector<PrecomputedTransactionData>\s+txdata\b[^;]+;)/$2\n$1/g' src/validation.cpp
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  fi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            git add -A
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      git commit -m "Merge Bitcoin Core ${TARGET_TAG} into Scash with v28.4 community settings and conflict report"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                git push -f origin "${NEW_BRANCH}"
