{"name":"Upgrade v28.4","on":{"push":{"branches":["scash-28.4-narnia"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"finalize-repo":{"runs-on":"ubuntu-24.04","env":{"GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"steps":[{"uses":"actions/checkout@v4","with":{"ref":"scash_master","fetch-depth":0}},{"run":"set -e; git config user.name \"iscpuminingreal\"; git config user.email \"iscpuminingreal@users.noreply.github.com\"; sed -i \"s/define(_SCASH_CLIENT_VERSION_MINOR, [0-9]*)/define(_SCASH_CLIENT_VERSION_MINOR, 1)/g; s/define(_SCASH_CLIENT_VERSION_BUILD, [0-9]*)/define(_SCASH_CLIENT_VERSION_BUILD, 0)/g\" configure.ac; sed -i \"s/Bitcoin Core v26\\.0/Bitcoin Core v28.4/g\" doc/build-scash.md 2>/dev/null || true; if [ -f doc/README_windows_scash.txt ] && ! grep -q \"LOCALAPPDATA\" doc/README_windows_scash.txt; then   printf \"\\nData Directory Note (Scash 2.1.0+)\\n----------------------------------\\nStarting in Scash 2.1.0 (Bitcoin Core 28.4), fresh installations on Windows create the default data directory at %%LOCALAPPDATA%%\\\\Scash (C:\\\\Users\\\\USERNAME\\\\AppData\\\\Local\\\\Scash). Existing installations in %%APPDATA%%\\\\Scash (AppData\\\\Roaming\\\\Scash) continue working automatically.\\n\" >> doc/README_windows_scash.txt; fi; mkdir -p doc/release-notes/scash; rm -f doc/release-notes/scash/release-notes-2.8.4.md; { echo \"Scash version 2.1.0 is now available from:\";   echo \"\";   echo \"  https://github.com/ScashNetworkCommunity/scash/releases/tag/scash_v2.1.0-narnia-core-28.4.0\";   echo \"\";   echo \"This release upgrades Scash Core from Bitcoin Core 27.0 (scash_v2.0.0-narnia-core-27.0.0) to Bitcoin Core 28.4 (scash_v2.1.0-narnia-core-28.4.0) while preserving all Scash mainnet consensus rules, the 112-byte RandomX v1.2.1 block header, and the aserti3-2d per-block difficulty adjustment algorithm (SIP-0010).\";   echo \"\";   echo \"Notable Changes in Scash 2.1.0\";   echo \"==============================\";   echo \"- Rebase onto Bitcoin Core 28.4 (isolating Testnet4/BIP94 rules from Scash networks).\";   echo \"- Blockfile XOR obfuscation enabled by default (-blocksxor=1 / DEFAULT_BLOCKS_XOR = true).\";   echo \"- TRUC (v3) transactions, 1P1C package relay, and Pay-to-Anchor (P2A) enabled while keeping opt-in RBF (-mempoolfullrbf=0 default).\";   echo \"- Legacy single-string warnings RPC output preserved by default alongside JSON-RPC 2.0 updates.\";   echo \"- Fresh Windows installs default to %LOCALAPPDATA%\\\\Scash (AppData\\\\Local\\\\Scash) while preserving existing AppData\\\\Roaming\\\\Scash folders.\";   echo \"- Security backports included for CVE-2024-35202, CVE-2024-52919 (part 2), CVE-2024-52911, CVE-2025-54604, CVE-2025-54605, CVE-2025-46598, and CVE-2025-46597.\"; } > doc/release-notes/scash/release-notes-2.1.0.md; git add configure.ac doc/build-scash.md doc/README_windows_scash.txt doc/release-notes/scash/release-notes-2.1.0.md; git commit -m \"Release Scash v2.1.0 (upgrade to Bitcoin Core v28.4) and update documentation\" || true; git push origin HEAD:scash_master; git tag -f scash_v2.1.0-narnia-core-28.4.0 HEAD; git push -f origin refs/tags/scash_v2.1.0-narnia-core-28.4.0; mkdir -p /tmp/migrate && cd /tmp/migrate; gh release download scash_v2.1.0-narnia-core-28.4.0 -R ScashNetworkCommunity/scash --clobber 2>/dev/null || true; LREL=\"scash-2.1.0-narnia-core-28.4.0-x86_64-pc-linux-gnu\"; WREL=\"scash-2.1.0-narnia-core-28.4.0-win64\"; if [ -f \"scash-2.8.4-narnia-core-28.4.0-x86_64-pc-linux-gnu.tgz\" ]; then   tar -xzf \"scash-2.8.4-narnia-core-28.4.0-x86_64-pc-linux-gnu.tgz\";   mv \"scash-2.8.4-narnia-core-28.4.0-x86_64-pc-linux-gnu\" \"$LREL\";   tar -czf \"${LREL}.tgz\" \"$LREL\";   (cd \"$LREL\" && sha256sum * > /tmp/migrate/SHA256SUMS-linux.txt);   sha256sum \"${LREL}.tgz\" >> /tmp/migrate/SHA256SUMS-linux.txt; fi; if [ -f \"scash-2.8.4-narnia-core-28.4.0-win64-setup.exe\" ]; then   cp \"scash-2.8.4-narnia-core-28.4.0-win64-setup.exe\" \"${WREL}-setup.exe\";   zip -q \"${WREL}-setup.zip\" \"${WREL}-setup.exe\";   sha256sum \"${WREL}-setup.exe\" \"${WREL}-setup.zip\" > /tmp/migrate/SHA256SUMS-windows.txt; fi; { echo \"Scash 2.1.0 upgrades the Scash node and GUI wallet from Bitcoin Core 27.0 to Bitcoin Core 28.4.\";   echo \"\";   echo \"Please read the [release notes](https://github.com/ScashNetworkCommunity/scash/blob/scash_master/doc/release-notes/scash/release-notes-2.1.0.md) for more information.\";   echo \"\";   echo \"Users are advised to build from source. Binaries are provided only for convenience.\";   echo \"\";   echo \"Important: Verify hashes using sha256sum. If the hashes do not match, do not run the binaries and file a GitHub issue immediately to alert the developers!\";   echo \"\";   echo \"\\`\\`\\`text\";   echo \"Linux (compiled on Ubuntu 22.04)\";   cat /tmp/migrate/SHA256SUMS-linux.txt 2>/dev/null || true;   echo \"\";   echo \"Windows\";   cat /tmp/migrate/SHA256SUMS-windows.txt 2>/dev/null || true;   echo \"\\`\\`\\`\"; } > /tmp/migrate/release_body.md; gh release edit scash_v2.1.0-narnia-core-28.4.0 --title \"Scash 2.1.0\" --latest --notes-file /tmp/migrate/release_body.md -R ScashNetworkCommunity/scash; if [ -f \"${LREL}.tgz\" ] && [ -f \"${WREL}-setup.exe\" ] && [ -f \"${WREL}-setup.zip\" ]; then   gh release upload scash_v2.1.0-narnia-core-28.4.0 \"${LREL}.tgz\" \"${WREL}-setup.exe\" \"${WREL}-setup.zip\" --clobber -R ScashNetworkCommunity/scash; fi; for old_asset in scash-2.8.4-narnia-core-28.4.0-win64-setup.exe scash-2.8.4-narnia-core-28.4.0-win64-setup.zip scash-2.8.4-narnia-core-28.4.0-x86_64-pc-linux-gnu.tgz SHA256SUMS-linux.txt SHA256SUMS-windows.txt; do   gh release delete-asset scash_v2.1.0-narnia-core-28.4.0 \"$old_asset\" -y -R ScashNetworkCommunity/scash 2>/dev/null || true; done; git push origin :refs/tags/scash_v2.8.4-narnia-core-28.4.0 2>/dev/null || true"}]},"package-linux":{"needs":["finalize-repo"],"runs-on":"ubuntu-22.04","env":{"GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"steps":[{"uses":"ac