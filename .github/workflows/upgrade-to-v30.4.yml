name: Scash Core 2.4.0 Exchange Tab Upgrade & Build

# Save this file in your GitHub repository at:
#   .github/workflows/scash-2.4.0-exchange.yml
#
# Then open the "Actions" tab on https://github.com/ScashNetworkCommunity/scash,
# click "Scash Core 2.4.0 Exchange Tab Upgrade & Build", and click "Run workflow".
# No local .zip extraction or local terminal is required!

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Source branch to upgrade from"
        required: true
        default: "scash_master"
        type: string
      target_branch:
        description: "Branch to commit & push Scash Core 2.4.0 Exchange Tab to"
        required: true
        default: "scash-2.4.0-exchange"
        type: string
      open_pull_request:
        description: "Open a Pull Request into base_branch automatically"
        required: true
        default: true
        type: boolean
      build_linux_qt:
        description: "Compile Scash Core 2.4.0 Qt6 GUI & Daemon (Ubuntu x86_64)"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - scash-2.4.0-exchange

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-2-4-0-exchange-upgrade:
    name: Apply 2.4.0 Exchange Tab & Run HTLC Unit Tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Scash Core (${{ inputs.base_branch }})
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          submodules: recursive

      - name: Unpack Embedded 2.4.0 Exchange Module & Patch Repository
