          python3 /tmp/scash-2.4.0-pkg/apply_scash_2_4_0_exchange.py .

      - name: Compile & Execute C++20 On-Chain HTLC / OrderBook Unit Tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            src/qt/exchangehtlc.cpp \
            contrib/dex/test_exchange_htlc.cpp \
            -o /tmp/test_exchange_htlc
          /tmp/test_exchange_htlc

      - name: Export Git Patch Artifact
        run: |
          git add CMakeLists.txt src/qt/ contrib/dex/
          git diff --cached > /tmp/scash-2.4.0-exchange.patch

      - name: Upload Scash 2.4.0 Git Patch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scash-2.4.0-exchange-patch
          path: /tmp/scash-2.4.0-exchange.patch

      - name: Commit & Push 2.4.0 Exchange Branch (and Open PR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          OPEN_PR: ${{ inputs.open_pull_request }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$TARGET_BRANCH"
          git add CMakeLists.txt src/qt/ contrib/dex/
          if git diff --cached --quiet; then
            echo "Scash 2.4.0 Exchange changes are already committed on $TARGET_BRANCH."
          else
            git commit -m "feat(qt): add native on-chain HTLC Exchange tab (SCASH/USDT, SCASH/BTC) and bump to v2.4.0"
          fi
          git push --force-with-lease origin "$TARGET_BRANCH"
          if [ "$OPEN_PR" = "true" ] && [ "$TARGET_BRANCH" != "$BASE_BRANCH" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$TARGET_BRANCH" \
              --title "Scash Core v2.4.0: Native On-Chain HTLC Exchange Tab (scash-qt & QtKawaii)" \
              --body "Upgrades Scash Core to **2.4.0** and adds the built-in non-custodial **&Exchange** tab (\`SCASH/USDT\` and \`SCASH/BTC\`) to both \`scash-qt\` and \`QtKawaii\`." \
              || echo "Pull Request already exists or branch updated."
          fi

  build-scash-2-4-0-linux-qt:
    name: Build Scash Core 2.4.0 (scash-qt & scashd Linux x86_64)
    needs: [apply-2-4-0-exchange-upgrade]
    if: |
      always() &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.build_linux_qt == true && needs.apply-2-4-0-exchange-upgrade.result == 'success')
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Upgraded 2.4.0 Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}
          submodules: recursive

      - name: Install Bitcoin/Scash Core 30.4 & Qt 6 Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 ccache git \
            libevent-dev libboost-dev libsqlite3-dev libzmq3-dev libqrencode-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libqt6svg6-dev

      - name: Build RandomX Dependency (If Not Bundled In-Tree)
        run: |
          if [ ! -d "src/crypto/randomx" ] && ! find src -maxdepth 3 -iname "*randomx*" | grep -q .; then
            git clone -b scash https://github.com/ScashNetworkCommunity/RandomX.git /tmp/RandomX
            cmake -B /tmp/RandomX/build -S /tmp/RandomX -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/RandomX/build -j"$(nproc)"
            sudo cmake --install /tmp/RandomX/build
          fi

      - name: Configure & Build Scash Core 2.4.0 with Qt 6 Exchange Tab
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=ON \
            -DWITH_ZMQ=ON \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF
          cmake --build build -j"$(nproc)"

      - name: Stage Compiled v2.4.0 Binaries
        run: |
          mkdir -p dist-scash-2.4.0-linux-x86_64
          cp -v build/bin/* dist-scash-2.4.0-linux-x86_64/ || cp -v build/src/qt/*qt* build/src/*d build/src/*cli dist-scash-2.4.0-linux-x86_64/
          cp -v contrib/dex/ScashHTLCERC20.sol dist-scash-2.4.0-linux-x86_64/

      - name: Upload Compiled Scash Core 2.4.0 Qt6 Binaries
        uses: actions/upload-artifact@v4
        with:
          name: scash-core-2.4.0-linux-x86_64-qt
          path: dist-scash-2.4.0-linux-x86_64/
