# Scash Core 2.4.0 Exchange Workflow — Revision v6 (Fixes 0xc00000fd crash + Full 2.3.0-Style Release Pipeline)
# Save at: .github/workflows/scash-2.4.0-exchange.yml on branch scash_master

name: Scash Core 2.4.0 Exchange Tab Upgrade & Build

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Source branch to upgrade from"
        required: true
        default: "scash_master"
        type: string
      target_branch:
        description: "Branch to commit & push Scash Core 2.4.0 Exchange Tab to"
        required: true
        default: "scash-2.4.0-exchange-tab"
        type: string
      open_pull_request:
        description: "Open or update Pull Request into base_branch automatically"
        required: true
        default: true
        type: boolean
      build_linux_debian_ubuntu:
        description: "Build Linux x86_64 release package (.tgz + .deb)"
        required: true
        default: true
        type: boolean
      build_windows_11:
        description: "Build Windows 11 x64 release packages (win64-setup.exe & win64-setup.zip)"
        required: true
        default: true
        type: boolean
      create_github_release:
        description: "Create/update Scash 2.4.0 GitHub Release (2.3.0 format + sha256sum block)"
        required: true
        default: true
        type: boolean
      draft_release:
        description: "Create Release as Draft first (uncheck to publish Latest immediately)"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - scash-2.4.0-exchange
      - scash-2.4.0-exchange-tab

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-2-4-0-exchange-upgrade:
    name: Apply 2.4.0 Exchange Tab & Run HTLC Unit Tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Scash Core (${{ inputs.base_branch }})
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          submodules: recursive

