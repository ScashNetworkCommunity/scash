  build-linux-debian-ubuntu:

    name: Build Linux (Ubuntu 22.04 / Debian x86_64 .tgz + scash-qtkawaii)

    needs: [apply-2-4-0-exchange-upgrade]

    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_linux_debian_ubuntu == true && needs.apply-2-4-0-exchange-upgrade.result == 'success'))

    runs-on: ubuntu-22.04

    timeout-minutes: 180

    steps:

      - name: Checkout Upgraded 2.4.0 Branch

        uses: actions/checkout@v4

        with:

          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}

          submodules: recursive



      - name: Install Linux depends Build Prerequisites

        run: |

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config python3 curl ca-certificates autoconf automake libtool bsdmainutils bison gperf patchelf zip unzip xz-utils patch ccache dpkg-dev libboost-dev libxkbcommon-dev libxcb-xinerama0-dev libfontconfig1-dev libfreetype6-dev



      - name: Restore Cached Linux Static depends

        id: cache-linux-depends

        uses: actions/cache/restore@v4

        with:

          path: |

            depends/built

            depends/sources

          key: scash-240-depends-linux-${{ hashFiles('depends/packages/**', 'depends/Makefile') }}

          restore-keys: scash-240-depends-linux-



      - name: Build Scash Bundled Linux Dependencies

        run: |

          make -C depends HOST=x86_64-pc-linux-gnu NO_ZMQ=1 NO_USDT=1 NO_IPC=1 -j"$(nproc)"

          mkdir -p depends/x86_64-pc-linux-gnu/include/boost/compute/detail

          cp -f src/boost/compute/detail/lru_cache.hpp depends/x86_64-pc-linux-gnu/include/boost/compute/detail/lru_cache.hpp

          if [ ! -f depends/x86_64-pc-linux-gnu/include/boost/optional.hpp ] && [ -d /usr/include/boost/optional ]; then cp -rn /usr/include/boost/optional* /usr/include/boost/none* /usr/include/boost/Move* depends/x86_64-pc-linux-gnu/include/boost/ 2>/dev/null || true; fi



      - name: Save Linux Static depends Cache Immediately

        if: always() && steps.cache-linux-depends.outputs.cache-matched-key != steps.cache-linux-depends.outputs.cache-primary-key

        uses: actions/cache/save@v4

        with:

          path: |

            depends/built

            depends/sources

          key: ${{ steps.cache-linux-depends.outputs.cache-primary-key }}



      - name: Configure & Compile Scash 2.4.0 Linux Suite

        run: python3 contrib/dex/ci_helpers.py build-linux



      - name: Package 2.3.0-Style Linux .tgz & .deb

        run: python3 contrib/dex/ci_helpers.py package-linux



      - name: Upload Linux 2.4.0 Release Artifacts

        uses: actions/upload-artifact@v4

        with:

          name: scash-2.4.0-linux-release

          path: |

            out-linux/scash-2.4.0-mid-world-core-30.4.0-x86_64-pc-linux-gnu.tgz

            out-linux/scash-core_2.4.0_amd64.deb

            out-linux/SHA256SUMS-linux.txt



  build-windows-11:

    name: Build Windows 11 x64 (win64-setup.exe & win64-setup.zip + scash-qtkawaii.exe)

    needs: [apply-2-4-0-exchange-upgrade]

    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_windows_11 == true && needs.apply-2-4-0-exchange-upgrade.result == 'success'))

    runs-on: ubuntu-24.04

    timeout-minutes: 180

    steps:

      - name: Checkout Upgraded 2.4.0 Branch

        uses: actions/checkout@v4

        with:

          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}

          submodules: recursive



      - name: Install MinGW-w64 POSIX Cross-Compiler & NSIS

        run: |

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config python3 curl ca-certificates autoconf automake libtool bsdmainutils bison gperf zip unzip xz-utils patch ccache libboost-dev g++-mingw-w64-x86-64-posix nsis

          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix



      - name: Restore Cached Windows x64 depends

        id: cache-win-depends

        uses: actions/cache/restore@v4

        with:

          path: |

            depends/built

            depends/sources

          key: scash-240-depends-win64-${{ hashFiles('depends/packages/**', 'depends/Makefile') }}

          restore-keys: scash-240-depends-win64-



      - name: Build Windows x64 Dependencies via depends

        run: |

          make -C depends HOST=x86_64-w64-mingw32 NO_ZMQ=1 NO_USDT=1 NO_IPC=1 -j"$(nproc)"

          mkdir -p depends/x86_64-w64-mingw32/include/boost/compute/detail

          cp -f src/boost/compute/detail/lru_cache.hpp depends/x86_64-w64-mingw32/include/boost/compute/detail/lru_cache.hpp

          if [ ! -f depends/x86_64-w64-mingw32/include/boost/optional.hpp ] && [ -d /usr/include/boost/optional ]; then cp -rn /usr/include/boost/optional* /usr/include/boost/none* depends/x86_64-w64-mingw32/include/boost/ 2>/dev/null || true; fi



      - name: Save Windows x64 depends Cache Immediately

        if: always() && steps.cache-win-depends.outputs.cache-matched-key != steps.cache-win-depends.outputs.cache-primary-key

        uses: actions/cache/save@v4

        with:

          path: |

            depends/built

            depends/sources

          key: ${{ steps.cache-win-depends.outputs.cache-primary-key }}



      - name: Cross-Compile & Package Windows 2.4.0 Release (win64-setup.exe & win64-setup.zip)

        run: python3 contrib/dex/ci_helpers.py build-and-package-windows



      - name: Upload Windows 2.4.0 Release Artifacts

        uses: actions/upload-artifact@v4

        with:

          name: scash-2.4.0-windows-release

          path: |

            out-win/scash-2.4.0-mid-world-core-30.4.0-win64-setup.exe

            out-win/scash-2.4.0-mid-world-core-30.4.0-win64-setup.zip

            out-win/SHA256SUMS-windows.txt



  publish-2-4-0-release:

    name: Assemble Scash 2.4.0 Release (2.3.0 Format + SHA256SUMS)

    needs: [apply-2-4-0-exchange-upgrade, build-linux-debian-ubuntu, build-windows-11]

    if: github.event_name == 'workflow_dispatch' && inputs.create_github_release == true && needs.build-linux-debian-ubuntu.result == 'success' && needs.build-windows-11.result == 'success'

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout Upgraded 2.4.0 Branch

        uses: actions/checkout@v4

        with:

          ref: ${{ inputs.target_branch }}



      - name: Download Linux & Windows Release Artifacts

        uses: actions/download-artifact@v4

        with:

          path: release-dl



      - name: Create or Update Scash 2.4.0 GitHub Release (Matching 2.3.0 Layout)

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TARGET_BRANCH: ${{ inputs.target_branch }}

          IS_DRAFT: ${{ inputs.draft_release }}

        run: python3 contrib/dex/ci_helpers.py publish-release

