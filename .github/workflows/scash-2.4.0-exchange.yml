name: Scash Core 2.4.0 Exchange Tab Upgrade & Build

# Save at: .github/workflows/scash-2.4.0-exchange.yml
# Builds:
#   1. Debian 12/13 & Ubuntu 22.04/24.04 Linux x86_64 (.deb installer + portable .tar.gz)
#   2. Windows 11 x64 (scash-qt.exe, scashd.exe, scash-cli.exe portable .zip + setup .exe)

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Source branch to upgrade from"
        required: true
        default: "scash_master"
        type: string
      target_branch:
        description: "Branch to commit & push Scash Core 2.4.0 Exchange Tab to"
        required: true
        default: "scash-2.4.0-exchange-tab"
        type: string
      open_pull_request:
        description: "Open or update Pull Request into base_branch automatically"
        required: true
        default: true
        type: boolean
      build_linux_debian_ubuntu:
        description: "Build Linux x86_64 binaries + .deb for Debian & Ubuntu"
        required: true
        default: true
        type: boolean
      build_windows_11:
        description: "Build Windows 11 x64 .exe binaries (scash-qt.exe & scashd.exe)"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - scash-2.4.0-exchange
      - scash-2.4.0-exchange-tab

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-2-4-0-exchange-upgrade:
    name: Apply 2.4.0 Exchange Tab & Run HTLC Unit Tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Scash Core (${{ inputs.base_branch }})
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          submodules: recursive

