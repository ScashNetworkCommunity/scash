          key: ${{ steps.cache-linux-depends.outputs.cache-primary-key }}



      - name: Configure & Compile Scash 2.4.0 Linux Suite

        run: python3 contrib/dex/ci_helpers.py build-linux



      - name: Package 2.3.0-Style Linux .tgz & .deb

        run: python3 contrib/dex/ci_helpers.py package-linux



      - name: Upload Linux 2.4.0 Release Artifacts

        uses: actions/upload-artifact@v4

        with:

          name: scash-2.4.0-linux-release

