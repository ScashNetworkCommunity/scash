  build-linux-debian-ubuntu:

    name: Build Linux (Ubuntu 22.04 / Debian x86_64 .tgz + scash-qtkawaii)

    needs: [apply-2-4-0-exchange-upgrade]

    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_linux_debian_ubuntu == true && needs.apply-2-4-0-exchange-upgrade.result == 'success'))

    runs-on: ubuntu-22.04

    timeout-minutes: 180

    steps:

      - name: Checkout Upgraded 2.4.0 Branch

        uses: actions/checkout@v4

        with:

          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}

          submodules: recursive



      - name: Install Linux depends Build Prerequisites

        run: |

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config python3 curl ca-certificates autoconf automake libtool bsdmainutils bison gperf patchelf zip unzip xz-utils patch ccache dpkg-dev libboost-dev libxkbcommon-dev libxcb-xinerama0-dev libfontconfig1-dev libfreetype6-dev



      - name: Restore Cached Linux Static depends

        id: cache-linux-depends

        uses: actions/cache/restore@v4

        with:

          path: |

            depends/built

            depends/sources

          key: scash-240-depends-linux-${{ hashFiles('depends/packages/**', 'depends/Makefile') }}

          restore-keys: scash-240-depends-linux-



      - name: Build Scash Bundled Linux Dependencies

        run: |

          make -C depends HOST=x86_64-pc-linux-gnu NO_ZMQ=1 NO_USDT=1 NO_IPC=1 -j"$(nproc)"

          mkdir -p depends/x86_64-pc-linux-gnu/include/boost/compute/detail

          cp -f src/boost/compute/detail/lru_cache.hpp depends/x86_64-pc-linux-gnu/include/boost/compute/detail/lru_cache.hpp

          if [ ! -f depends/x86_64-pc-linux-gnu/include/boost/optional.hpp ] && [ -d /usr/include/boost/optional ]; then cp -rn /usr/include/boost/optional* /usr/include/boost/none* /usr/include/boost/Move* depends/x86_64-pc-linux-gnu/include/boost/ 2>/dev/null || true; fi



      - name: Save Linux Static depends Cache Immediately

        if: always() && steps.cache-linux-depends.outputs.cache-matched-key != steps.cache-linux-depends.outputs.cache-primary-key

