      - name: Compile & Execute C++20 On-Chain HTLC / OrderBook Unit Tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -DSCASH_DEX_STANDALONE_TEST=1 \
            -Isrc/qt \
            src/qt/exchangehtlc.cpp \
            contrib/dex/test_exchange_htlc.cpp \
            -o ./test_exchange_htlc_bin
          ./test_exchange_htlc_bin
          rm -f ./test_exchange_htlc_bin

      - name: Export Git Patch Artifact
        run: |
          git add CMakeLists.txt depends/ src/boost/ src/qt/ contrib/dex/
          git diff --cached > /tmp/scash-2.4.0-exchange.patch

      - name: Upload Scash 2.4.0 Git Patch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scash-2.4.0-exchange-patch
          path: /tmp/scash-2.4.0-exchange.patch

      - name: Commit & Push 2.4.0 Exchange Branch (and Open/Update PR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          OPEN_PR: ${{ inputs.open_pull_request }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git checkout -B "$TARGET_BRANCH"
          git add CMakeLists.txt depends/ src/boost/ src/qt/ contrib/dex/
          if git diff --cached --quiet; then
            echo "Scash 2.4.0 Exchange changes are already committed on $TARGET_BRANCH."
          else
            git commit -m "feat(qt): add native on-chain HTLC Exchange tab (Rev v5) and bump to v2.4.0"
          fi
          git push --force origin "$TARGET_BRANCH"
          if [ "$OPEN_PR" = "true" ] && [ "$TARGET_BRANCH" != "$BASE_BRANCH" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$TARGET_BRANCH" \
              --title "Scash Core v2.4.0: Native On-Chain HTLC Exchange Tab (scash-qt & QtKawaii)" \
              --body "Upgrades Scash Core to **2.4.0**, restores boost/compute/detail/lru_cache.hpp for RandomX PoW under Core 30.4, and adds the built-in non-custodial **&Exchange** tab (SCASH/USDT and SCASH/BTC) to both scash-qt and QtKawaii." \
              || echo "Pull Request already exists and was updated with the latest force-push."
          fi

  build-linux-debian-ubuntu:
    name: Build Linux (Debian 12/13 & Ubuntu 22.04/24.04 x86_64 + .deb)
    needs: [apply-2-4-0-exchange-upgrade]
    if: |
      always() &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.build_linux_debian_ubuntu == true && needs.apply-2-4-0-exchange-upgrade.result == 'success')
      )
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout Upgraded 2.4.0 Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}
          submodules: recursive

      - name: Install Linux depends Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 curl ca-certificates \
            autoconf automake libtool bsdmainutils bison gperf patchelf \
            zip unzip xz-utils patch ccache dpkg-dev libboost-dev \
            libxkbcommon-dev libxcb-xinerama0-dev libfontconfig1-dev libfreetype6-dev

      - name: Restore Cached Linux Static depends
        id: cache-linux-depends
        uses: actions/cache/restore@v4
        with:
          path: |
            depends/built
            depends/sources
          key: scash-240-depends-linux-${{ hashFiles('depends/packages/**', 'depends/Makefile') }}
          restore-keys: |
            scash-240-depends-linux-

      - name: Build Scash Bundled Linux Dependencies (per doc/build_scash.md)
        run: |
          make -C depends HOST=x86_64-pc-linux-gnu NO_ZMQ=1 NO_USDT=1 NO_IPC=1 -j"$(nproc)"
          mkdir -p depends/x86_64-pc-linux-gnu/include/boost/compute/detail
          cp -f src/boost/compute/detail/lru_cache.hpp depends/x86_64-pc-linux-gnu/include/boost/compute/detail/lru_cache.hpp
          if [ ! -f depends/x86_64-pc-linux-gnu/include/boost/optional.hpp ] && [ -d /usr/include/boost/optional ]; then
            cp -rn /usr/include/boost/optional* /usr/include/boost/none* /usr/include/boost/Move* depends/x86_64-pc-linux-gnu/include/boost/ 2>/dev/null || true
          fi

      - name: Save Linux Static depends Cache Immediately
        if: always() && steps.cache-linux-depends.outputs.cache-matched-key != steps.cache-linux-depends.outputs.cache-primary-key
        uses: actions/cache/save@v4
        with:
          path: |
            depends/built
            depends/sources
          key: ${{ steps.cache-linux-depends.outputs.cache-primary-key }}

      - name: Configure & Compile Scash Core 2.4.0 (Portable Debian + Ubuntu Binary)
        run: |
          cmake -B build \
            --toolchain depends/x86_64-pc-linux-gnu/toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=ON \
            -DBUILD_TESTS=OFF
          cmake --build build -j"$(nproc)"

      - name: Package Portable .tar.gz & Installable Debian/Ubuntu .deb
        run: |
          mkdir -p out-linux/scash-2.4.0-linux64/bin
          for bin in scash-qt scashd scash-cli scash-tx scash-wallet scash-util bitcoin-qt bitcoind bitcoin-cli; do
            if [ -f "build/bin/$bin" ]; then
              strip "build/bin/$bin" || true
              cp -v "build/bin/$bin" out-linux/scash-2.4.0-linux64/bin/
            fi
          done
          cp -v contrib/dex/ScashHTLCERC20.sol out-linux/scash-2.4.0-linux64/
          tar -czf out-linux/scash-core-2.4.0-debian-ubuntu-x86_64.tar.gz -C out-linux scash-2.4.0-linux64

          DEB_ROOT="out-linux/scash-core_2.4.0_amd64"
          mkdir -p "$DEB_ROOT/DEBIAN" "$DEB_ROOT/usr/bin" "$DEB_ROOT/usr/share/applications"
          chmod 0755 "$DEB_ROOT" "$DEB_ROOT/DEBIAN" "$DEB_ROOT/usr" "$DEB_ROOT/usr/bin" "$DEB_ROOT/usr/share" "$DEB_ROOT/usr/share/applications"
          cp -v out-linux/scash-2.4.0-linux64/bin/* "$DEB_ROOT/usr/bin/"
          GUI_BIN="scash-qt"
          if [ ! -f "$DEB_ROOT/usr/bin/scash-qt" ] && [ -f "$DEB_ROOT/usr/bin/bitcoin-qt" ]; then
            GUI_BIN="bitcoin-qt"
          fi
          cat << EOF > "$DEB_ROOT/DEBIAN/control"
          Package: scash-core
          Version: 2.4.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libc6 (>= 2.35), libx11-6, libxcb1, libfontconfig1
          Maintainer: ScashNetworkCommunity <noreply@scashnetwork.com>
          Description: Scash Core 2.4.0 Node and QtKawaii Wallet with Native On-Chain HTLC Exchange
          EOF
          chmod 0644 "$DEB_ROOT/DEBIAN/control"
          cat << EOF > "$DEB_ROOT/usr/share/applications/scash-qt.desktop"
          [Desktop Entry]
          Name=Scash Core 2.4.0 (QtKawaii & DEX)
          Comment=Scash Core Wallet and Decentralized On-Chain Exchange
          Exec=/usr/bin/$GUI_BIN -server=1
          Terminal=false
          Type=Application
          Categories=Finance;Network;P2P;Qt;
          EOF
          chmod 0644 "$DEB_ROOT/usr/share/applications/scash-qt.desktop"
          dpkg-deb --build "$DEB_ROOT" out-linux/scash-core_2.4.0_amd64.deb

      - name: Upload Debian & Ubuntu Linux Artifacts (.deb + .tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: scash-core-2.4.0-linux-debian-ubuntu-x86_64
          path: |
            out-linux/scash-core_2.4.0_amd64.deb
            out-linux/scash-core-2.4.0-debian-ubuntu-x86_64.tar.gz

  build-windows-11:
    name: Build Windows 11 x64 (scash-qt.exe & scashd.exe)
    needs: [apply-2-4-0-exchange-upgrade]
    if: |
      always() &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.build_windows_11 == true && needs.apply-2-4-0-exchange-upgrade.result == 'success')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Upgraded 2.4.0 Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}
          submodules: recursive

      - name: Install MinGW-w64 POSIX Cross-Compiler & NSIS (per doc/build_scash.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 curl ca-certificates \
            autoconf automake libtool bsdmainutils bison gperf \
            zip unzip xz-utils patch ccache libboost-dev \
            g++-mingw-w64-x86-64-posix nsis
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Restore Cached Windows x64 depends
        id: cache-win-depends
        uses: actions/cache/restore@v4
        with:
          path: |
            depends/built
            depends/sources
          key: scash-240-depends-win64-${{ hashFiles('depends/packages/**', 'depends/Makefile') }}
          restore-keys: |
            scash-240-depends-win64-

      - name: Build Windows x64 Dependencies via depends (per doc/build_scash.md)
        run: |
          make -C depends HOST=x86_64-w64-mingw32 NO_ZMQ=1 NO_USDT=1 NO_IPC=1 -j"$(nproc)"
          mkdir -p depends/x86_64-w64-mingw32/include/boost/compute/detail
          cp -f src/boost/compute/detail/lru_cache.hpp depends/x86_64-w64-mingw32/include/boost/compute/detail/lru_cache.hpp
          if [ ! -f depends/x86_64-w64-mingw32/include/boost/optional.hpp ] && [ -d /usr/include/boost/optional ]; then
            cp -rn /usr/include/boost/optional* /usr/include/boost/none* depends/x86_64-w64-mingw32/include/boost/ 2>/dev/null || true
          fi

      - name: Save Windows x64 depends Cache Immediately
        if: always() && steps.cache-win-depends.outputs.cache-matched-key != steps.cache-win-depends.outputs.cache-primary-key
        uses: actions/cache/save@v4
        with:
          path: |
            depends/built
            depends/sources
          key: ${{ steps.cache-win-depends.outputs.cache-primary-key }}

      - name: Configure & Cross-Compile Scash Core 2.4.0 Windows 11 .exe Binaries
        run: |
          cmake -B build-win \
            --toolchain depends/x86_64-w64-mingw32/toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=ON \
            -DBUILD_TESTS=OFF
          cmake --build build-win -j"$(nproc)"
          cmake --build build-win --target deploy || true
          x86_64-w64-mingw32-strip build-win/bin/*.exe || true

      - name: Package Windows 11 Portable .zip & Setup Installer
        run: |
          mkdir -p out-win/scash-2.4.0-win64
          cp -v build-win/bin/*.exe out-win/scash-2.4.0-win64/
          cp -v contrib/dex/ScashHTLCERC20.sol out-win/scash-2.4.0-win64/
          (cd out-win && zip -r scash-core-2.4.0-windows11-x64.zip scash-2.4.0-win64)
          find build-win -maxdepth 2 -iname "*setup*.exe" -exec cp -v {} out-win/ \; || true

      - name: Upload Windows 11 x64 Artifacts (.zip + .exe)
        uses: actions/upload-artifact@v4
        with:
          name: scash-core-2.4.0-windows11-x64
          path: |
            out-win/scash-core-2.4.0-windows11-x64.zip
            out-win/*setup*.exe
