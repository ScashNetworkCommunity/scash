      - name: Upload Scash 2.4.0 Git Patch Artifact

        uses: actions/upload-artifact@v4

        with:

          name: scash-2.4.0-exchange-patch

          path: /tmp/scash-2.4.0-exchange.patch



      - name: Commit & Push 2.4.0 Exchange Branch (and Open/Update PR)

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          BASE_BRANCH: ${{ inputs.base_branch }}

          TARGET_BRANCH: ${{ inputs.target_branch }}

          OPEN_PR: ${{ inputs.open_pull_request }}

        run: |

          git config user.name "${{ github.actor }}"

          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          git checkout -B "$TARGET_BRANCH"

          git add CMakeLists.txt depends/ src/boost/ src/qt/ contrib/dex/ doc/release-notes/scash/release-notes-2.4.0.md

          if git diff --cached --quiet; then

            echo "Scash 2.4.0 Exchange changes are already committed on $TARGET_BRANCH."

          else

            git commit -m "feat(qt): add Scash 2.4.0 in-process scash1q HTLC Exchange tab, Swap Inspector, and 2.4.0 installer"

          fi

          git push --force origin "$TARGET_BRANCH"

          if [ "$OPEN_PR" = "true" ] && [ "$TARGET_BRANCH" != "$BASE_BRANCH" ]; then

            gh pr create \

              --base "$BASE_BRANCH" \

              --head "$TARGET_BRANCH" \

              --title "Scash Core v2.4.0: Native On-Chain HTLC Exchange Tab (scash-qt & scash-qtkawaii)" \

              --body "Upgrades Scash Core to **2.4.0** (\`Mid-World\` / Core \`30.4.0\`), adds \`doc/release-notes/scash/release-notes-2.4.0.md\`, and embeds the non-custodial **&Exchange** tab (\`SCASH/USDT\` and \`SCASH/BTC\`) with in-process \`scash1q...\` SegWit P2WSH HTLC locking across both \`scash-qt\` and \`scash-qtkawaii\`." \

              || echo "Pull Request already exists and was updated with the latest force-push."

          fi



  build-linux-debian-ubuntu:

    name: Build Linux (Ubuntu 22.04 / Debian x86_64 .tgz + scash-qtkawaii)

    needs: [apply-2-4-0-exchange-upgrade]

    if: |

      always() &&

      (

        github.event_name == 'push' ||

        (github.event_name == 'workflow_dispatch' && inputs.build_linux_debian_ubuntu == true && needs.apply-2-4-0-exchange-upgrade.result == 'success')

      )

    runs-on: ubuntu-22.04

    timeout-minutes: 180

    steps:

      - name: Checkout Upgraded 2.4.0 Branch

        uses: actions/checkout@v4

        with:

          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}

          submodules: recursive



      - name: Install Linux depends Build Prerequisites

        run: |

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \

            build-essential cmake ninja-build pkg-config python3 curl ca-certificates \

            autoconf automake libtool bsdmainutils bison gperf patchelf \

            zip unzip xz-utils patch ccache dpkg-dev libboost-dev \

            libxkbcommon-dev libxcb-xinerama0-dev libfontconfig1-dev libfreetype6-dev



      - name: Restore Cached Linux Static depends

        id: cache-linux-depends

        uses: actions/cache/restore@v4

        with:

          path: |

            depends/built

            depends/sources

          key: scash-240-depends-linux-${{ hashFiles('depends/packages/**', 'depends/Makefile') }}

          restore-keys: |

            scash-240-depends-linux-



      - name: Build Scash Bundled Linux Dependencies (per doc/build_scash.md)

        run: |

          make -C depends HOST=x86_64-pc-linux-gnu NO_ZMQ=1 NO_USDT=1 NO_IPC=1 -j"$(nproc)"

          mkdir -p depends/x86_64-pc-linux-gnu/include/boost/compute/detail

          cp -f src/boost/compute/detail/lru_cache.hpp depends/x86_64-pc-linux-gnu/include/boost/compute/detail/lru_cache.hpp

          if [ ! -f depends/x86_64-pc-linux-gnu/include/boost/optional.hpp ] && [ -d /usr/include/boost/optional ]; then

            cp -rn /usr/include/boost/optional* /usr/include/boost/none* /usr/include/boost/Move* depends/x86_64-pc-linux-gnu/include/boost/ 2>/dev/null || true

          fi



      - name: Save Linux Static depends Cache Immediately

        if: always() && steps.cache-linux-depends.outputs.cache-matched-key != steps.cache-linux-depends.outputs.cache-primary-key

        uses: actions/cache/save@v4

        with:

          path: |

            depends/built

            depends/sources

          key: ${{ steps.cache-linux-depends.outputs.cache-primary-key }}



      - name: Configure & Compile Scash 2.4.0 (Full 2.3.0 Binary Suite)

        run: |

          if cmake -B build \

            --toolchain depends/x86_64-pc-linux-gnu/toolchain.cmake \

            -DCMAKE_BUILD_TYPE=Release \

            -DBUILD_GUI=ON \

            -DBUILD_TESTS=ON \

            -DBUILD_GUI_TESTS=ON \

            -DBUILD_BENCH=ON && cmake --build build -j"$(nproc)"; then

            echo "Built full Linux binary + test + bench suite."

          else

            echo "Retrying clean release build with BUILD_TESTS=OFF BUILD_BENCH=OFF..."

            rm -rf build

            cmake -B build \

              --toolchain depends/x86_64-pc-linux-gnu/toolchain.cmake \

              -DCMAKE_BUILD_TYPE=Release \

              -DBUILD_GUI=ON \

              -DBUILD_TESTS=OFF \

              -DBUILD_BENCH=OFF

            cmake --build build -j"$(nproc)"

          fi



      - name: Package 2.3.0-Style Linux .tgz (scash-2.4.0/bin + scash-qtkawaii + sha256sum) & .deb

        run: |

          set -euo pipefail

          mkdir -p out-linux/scash-2.4.0/bin

          copy_or_map() {

            local primary="$1"

            local fallback="$2"

            local dest_name="$3"

            if [ -f "build/bin/$primary" ]; then

              strip "build/bin/$primary" || true

              cp -v "build/bin/$primary" "out-linux/scash-2.4.0/bin/$dest_name"

            elif [ -n "$fallback" ] && [ -f "build/bin/$fallback" ]; then

              strip "build/bin/$fallback" || true

              cp -v "build/bin/$fallback" "out-linux/scash-2.4.0/bin/$dest_name"

            fi

          }



          copy_or_map bench_scash bench_bitcoin bench_scash

          copy_or_map scash-cli bitcoin-cli scash-cli

          copy_or_map scash-qt bitcoin-qt scash-qt

          if [ -f "out-linux/scash-2.4.0/bin/scash-qt" ]; then

            cp -p "out-linux/scash-2.4.0/bin/scash-qt" "out-linux/scash-2.4.0/bin/scash-qtkawaii"

          fi

          copy_or_map scash-tx bitcoin-tx scash-tx

          copy_or_map scash-util bitcoin-util scash-util

          copy_or_map scash-wallet bitcoin-wallet scash-wallet

          copy_or_map scashd bitcoind scashd

          copy_or_map test_scash test_bitcoin test_scash

          copy_or_map test_scash-qt test_bitcoin-qt test_scash-qt



          TGZ_NAME="scash-2.4.0-mid-world-core-30.4.0-x86_64-pc-linux-gnu.tgz"

          tar -czf "out-linux/$TGZ_NAME" -C out-linux scash-2.4.0



          (

            cd out-linux/scash-2.4.0/bin

            sha256sum * | sort -k2

          ) > out-linux/SHA256SUMS-linux.txt

          (

            cd out-linux

            sha256sum "$TGZ_NAME"

          ) >> out-linux/SHA256SUMS-linux.txt

          cat out-linux/SHA256SUMS-linux.txt



          DEB_ROOT="out-linux/scash-core_2.4.0_amd64"

          mkdir -p "$DEB_ROOT/DEBIAN" "$DEB_ROOT/usr/bin" "$DEB_ROOT/usr/share/applications"

          chmod 0755 "$DEB_ROOT" "$DEB_ROOT/DEBIAN" "$DEB_ROOT/usr" "$DEB_ROOT/usr/bin" "$DEB_ROOT/usr/share" "$DEB_ROOT/usr/share/applications"

          for b in scashd scash-cli scash-qt scash-qtkawaii scash-tx scash-util scash-wallet; do

            if [ -f "out-linux/scash-2.4.0/bin/$b" ]; then

              cp -p "out-linux/scash-2.4.0/bin/$b" "$DEB_ROOT/usr/bin/"

            fi

          done

          cat << EOF > "$DEB_ROOT/DEBIAN/control"

          Package: scash-core

          Version: 2.4.0

          Section: utils

          Priority: optional

          Architecture: amd64

          Depends: libc6 (>= 2.35), libx11-6, libxcb1, libfontconfig1

          Maintainer: ScashNetworkCommunity <noreply@scashnetwork.com>

          Description: Scash Core 2.4.0 Node, scash-qt, and scash-qtkawaii Wallet with On-Chain HTLC Exchange

          EOF

          chmod 0644 "$DEB_ROOT/DEBIAN/control"

          cat << EOF > "$DEB_ROOT/usr/share/applications/scash-qtkawaii.desktop"

          [Desktop Entry]

          Name=Scash QtKawaii 2.4.0 (On-Chain DEX)

          Comment=Scash Core Kawaii Wallet and Decentralized On-Chain Exchange

          Exec=/usr/bin/scash-qtkawaii

          Terminal=false

          Type=Application

          Categories=Finance;Network;P2P;Qt;

          EOF

          chmod 0644 "$DEB_ROOT/usr/share/applications/scash-qtkawaii.desktop"

          dpkg-deb --build "$DEB_ROOT" out-linux/scash-core_2.4.0_amd64.deb



      - name: Upload Linux 2.4.0 Release Artifacts

        uses: actions/upload-artifact@v4

        with:

          name: scash-2.4.0-linux-release

          path: |

            out-linux/scash-2.4.0-mid-world-core-30.4.0-x86_64-pc-linux-gnu.tgz

            out-linux/scash-core_2.4.0_amd64.deb

            out-linux/SHA256SUMS-linux.txt



  build-windows-11:

    name: Build Windows 11 x64 (win64-setup.exe & win64-setup.zip + scash-qtkawaii.exe)

    needs: [apply-2-4-0-exchange-upgrade]

    if: |

      always() &&

      (

        github.event_name == 'push' ||

        (github.event_name == 'workflow_dispatch' && inputs.build_windows_11 == true && needs.apply-2-4-0-exchange-upgrade.result == 'success')

      )

    runs-on: ubuntu-24.04

    timeout-minutes: 180

    steps:

      - name: Checkout Upgraded 2.4.0 Branch

        uses: actions/checkout@v4

        with:

          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}

          submodules: recursive



      - name: Install MinGW-w64 POSIX Cross-Compiler & NSIS (per doc/build_scash.md)

        run: |

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \

            build-essential cmake ninja-build pkg-config python3 curl ca-certificates \

            autoconf automake libtool bsdmainutils bison gperf \

            zip unzip xz-utils patch ccache libboost-dev \

            g++-mingw-w64-x86-64-posix nsis

          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix



      - name: Restore Cached Windows x64 depends

        id: cache-win-depends

        uses: actions/cache/restore@v4

        with:

          path: |

            depends/built

            depends/sources

          key: scash-240-depends-win64-${{ hashFiles('depends/packages/**', 'depends/Makefile') }}

          restore-keys: |

            scash-240-depends-win64-



      - name: Build Windows x64 Dependencies via depends (per doc/build_scash.md)

        run: |

          make -C depends HOST=x86_64-w64-mingw32 NO_ZMQ=1 NO_USDT=1 NO_IPC=1 -j"$(nproc)"

          mkdir -p depends/x86_64-w64-mingw32/include/boost/compute/detail

          cp -f src/boost/compute/detail/lru_cache.hpp depends/x86_64-w64-mingw32/include/boost/compute/detail/lru_cache.hpp

          if [ ! -f depends/x86_64-w64-mingw32/include/boost/optional.hpp ] && [ -d /usr/include/boost/optional ]; then

            cp -rn /usr/include/boost/optional* /usr/include/boost/none* depends/x86_64-w64-mingw32/include/boost/ 2>/dev/null || true

          fi



      - name: Save Windows x64 depends Cache Immediately

        if: always() && steps.cache-win-depends.outputs.cache-matched-key != steps.cache-win-depends.outputs.cache-primary-key

        uses: actions/cache/save@v4

        with:

          path: |

            depends/built

            depends/sources

          key: ${{ steps.cache-win-depends.outputs.cache-primary-key }}



      - name: Configure & Cross-Compile Scash 2.4.0 Windows x64 Binaries

        run: |

          cmake -B build-win \

            --toolchain depends/x86_64-w64-mingw32/toolchain.cmake \

            -DCMAKE_BUILD_TYPE=Release \

            -DBUILD_GUI=ON \

            -DBUILD_TESTS=OFF \

            -DBUILD_BENCH=OFF

          cmake --build build-win -j"$(nproc)"

          cmake --install build-win --prefix build-win/deploy



      - name: Package 2.3.0-Style Windows Release (win64-setup.exe & win64-setup.zip + scash-qtkawaii.exe)

        run: |

          set -euo pipefail

          mkdir -p out-win/scash-2.4.0/bin

          copy_win() {

            local primary="$1"

            local fallback="$2"

            local dest_name="$3"

            if [ -f "build-win/bin/$primary" ]; then

              x86_64-w64-mingw32-strip "build-win/bin/$primary" || true

              cp -v "build-win/bin/$primary" "out-win/scash-2.4.0/bin/$dest_name"

            elif [ -n "$fallback" ] && [ -f "build-win/bin/$fallback" ]; then

              x86_64-w64-mingw32-strip "build-win/bin/$fallback" || true

              cp -v "build-win/bin/$fallback" "out-win/scash-2.4.0/bin/$dest_name"

            fi

          }



          copy_win scashd.exe bitcoind.exe scashd.exe

          copy_win scash-qt.exe bitcoin-qt.exe scash-qt.exe

          if [ -f "out-win/scash-2.4.0/bin/scash-qt.exe" ]; then

            cp -p "out-win/scash-2.4.0/bin/scash-qt.exe" "out-win/scash-2.4.0/bin/scash-qtkawaii.exe"

          fi

          copy_win scash-cli.exe bitcoin-cli.exe scash-cli.exe

          copy_win scash-tx.exe bitcoin-tx.exe scash-tx.exe

          copy_win scash-util.exe bitcoin-util.exe scash-util.exe

          copy_win scash-wallet.exe bitcoin-wallet.exe scash-wallet.exe



          if [ -d "build-win/deploy/bin" ]; then

            for f in out-win/scash-2.4.0/bin/*.exe; do

              cp -f "$f" "build-win/deploy/bin/"

            done

          fi



          ZIP_NAME="scash-2.4.0-mid-world-core-30.4.0-win64-setup.zip"

          SETUP_NAME="scash-2.4.0-mid-world-core-30.4.0-win64-setup.exe"



          (cd out-win && zip -r "$ZIP_NAME" scash-2.4.0)



          # Official Scash 2.3.0 NSIS installer pipeline (makensis -DBUILD_DIR=build-win share/setup.nsi)

          if [ -f "share/setup.nsi" ]; then

            makensis -DBUILD_DIR=build-win share/setup.nsi || true

          fi

          if ! find build-win . -maxdepth 2 -type f -iname '*setup*.exe' ! -path './out-win/*' | grep -q . && [ -f "build-win/share/setup.nsi" ]; then

            makensis -DBUILD_DIR=build-win build-win/share/setup.nsi || makensis build-win/share/setup.nsi || true

          fi



          FOUND_SETUP="$(find build-win . -maxdepth 2 -type f -iname '*setup*.exe' ! -path './out-win/*' | head -n 1 || true)"

          if [ -n "$FOUND_SETUP" ] && [ -s "$FOUND_SETUP" ]; then

            cp -v "$FOUND_SETUP" "out-win/$SETUP_NAME"

          else

            echo "Building self-contained NSIS Windows x64 Setup Installer..."

            cat << 'EOF_NSI' > out-win/scash-2.4.0-installer.nsi

          !include "MUI2.nsh"

          Name "Scash Core 2.4.0 (64-bit)"

          OutFile "scash-2.4.0-mid-world-core-30.4.0-win64-setup.exe"

          InstallDir "$PROGRAMFILES64\Scash"

          InstallDirRegKey HKCU "SOFTWARE\Scash" ""

          RequestExecutionLevel admin

          SetCompressor /SOLID lzma

          !insertmacro MUI_PAGE_WELCOME

          !insertmacro MUI_PAGE_DIRECTORY

          !insertmacro MUI_PAGE_INSTFILES

          !insertmacro MUI_PAGE_FINISH

          !insertmacro MUI_UNPAGE_CONFIRM

          !insertmacro MUI_UNPAGE_INSTFILES

          !insertmacro MUI_LANGUAGE "English"

          Section "Scash Core 2.4.0 (required)"

            SectionIn RO

            SetOutPath "$INSTDIR"

            File /r "scash-2.4.0\bin\*.exe"

            SetOutPath "$INSTDIR\daemon"

            File "scash-2.4.0\bin\scashd.exe"

            File "scash-2.4.0\bin\scash-cli.exe"

            File "scash-2.4.0\bin\scash-tx.exe"

            File "scash-2.4.0\bin\scash-util.exe"

            File "scash-2.4.0\bin\scash-wallet.exe"

            WriteRegStr HKCU "SOFTWARE\Scash" "" $INSTDIR

            WriteUninstaller "$INSTDIR\uninstall.exe"

            CreateDirectory "$SMPROGRAMS\Scash"

            CreateShortCut "$SMPROGRAMS\Scash\Scash Core (64-bit).lnk" "$INSTDIR\scash-qt.exe"

            CreateShortCut "$SMPROGRAMS\Scash\Scash QtKawaii (64-bit).lnk" "$INSTDIR\scash-qtkawaii.exe"

            CreateShortCut "$SMPROGRAMS\Scash\Uninstall Scash Core.lnk" "$INSTDIR\uninstall.exe"

            CreateShortCut "$DESKTOP\Scash Core.lnk" "$INSTDIR\scash-qt.exe"

            CreateShortCut "$DESKTOP\Scash QtKawaii.lnk" "$INSTDIR\scash-qtkawaii.exe"

          SectionEnd

          Section "Uninstall"

            RMDir /r "$SMPROGRAMS\Scash"

            Delete "$DESKTOP\Scash Core.lnk"

            Delete "$DESKTOP\Scash QtKawaii.lnk"

            RMDir /r "$INSTDIR\daemon"

            Delete "$INSTDIR\*.exe"

            RMDir "$INSTDIR"

            DeleteRegKey HKCU "SOFTWARE\Scash"

          SectionEnd

          EOF_NSI

            sed -i 's/^          //' out-win/scash-2.4.0-installer.nsi

            (cd out-win && makensis -V2 scash-2.4.0-installer.nsi)

          fi



          test -s "out-win/$SETUP_NAME"

          test -s "out-win/$ZIP_NAME"



          (

            cd out-win

            sha256sum "$SETUP_NAME"

            sha256sum "$ZIP_NAME"

          ) > out-win/SHA256SUMS-windows.txt

          cat out-win/SHA256SUMS-windows.txt



      - name: Upload Windows 2.4.0 Release Artifacts

        uses: actions/upload-artifact@v4

        with:

          name: scash-2.4.0-windows-release

          path: |

            out-win/scash-2.4.0-mid-world-core-30.4.0-win64-setup.exe

            out-win/scash-2.4.0-mid-world-core-30.4.0-win64-setup.zip

            out-win/SHA256SUMS-windows.txt



  publish-2-4-0-release:

    name: Assemble Scash 2.4.0 Release (2.3.0 Format + SHA256SUMS)

    needs: [apply-2-4-0-exchange-upgrade, build-linux-debian-ubuntu, build-windows-11]

    if: |

      github.event_name == 'workflow_dispatch' &&

      inputs.create_github_release == true &&

      needs.build-linux-debian-ubuntu.result == 'success' &&

      needs.build-windows-11.result == 'success'

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout Upgraded 2.4.0 Branch

        uses: actions/checkout@v4

        with:

          ref: ${{ inputs.target_branch }}



      - name: Download Linux & Windows Release Artifacts

        uses: actions/download-artifact@v4

        with:

          path: release-dl



      - name: Create or Update Scash 2.4.0 GitHub Release (Matching 2.3.0 Layout)

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TARGET_BRANCH: ${{ inputs.target_branch }}

          IS_DRAFT: ${{ inputs.draft_release }}

        run: |

          set -euo pipefail

          TAG="scash_v2.4.0-mid-world-core-30.4.0"

          LINUX_SHA="$(cat release-dl/scash-2.4.0-linux-release/SHA256SUMS-linux.txt)"

          WIN_SHA="$(cat release-dl/scash-2.4.0-windows-release/SHA256SUMS-windows.txt)"



          cat << EOF > /tmp/release_body_2_4_0.md

          Scash 2.4.0 ("Mid-World") upgrades the Scash node and Qt 6 GUI wallet (\`scash-qt\` and \`scash-qtkawaii\`) on **Bitcoin Core 30.4** with a built-in, 100% non-custodial on-chain atomic swap **Exchange** tab (\`SCASH/USDT\` and \`SCASH/BTC\`), 10x lower minimum transaction fees (\`0.00000100 SCASH/kvB\` = \`0.1 sat/vB\`), all Bitcoin Core 30.0–30.4 security fixes, and full consensus compatibility with the existing Scash network (RandomX v1.2.1).



          See the full release notes in [\`doc/release-notes/scash/release-notes-2.4.0.md\`](https://github.com/${{ github.repository }}/blob/$TARGET_BRANCH/doc/release-notes/scash/release-notes-2.4.0.md).



          Users are advised to build from source. Binaries are provided only for convenience.



          Important: Verify hashes using \`sha256sum\`. If the hashes do not match, do not run the binaries and file a GitHub issue immediately to alert the developers!



          \`\`\`text

          Linux (compiled on Ubuntu 22.04)

          $LINUX_SHA



          Windows

          $WIN_SHA

          \`\`\`

          EOF

          sed -i 's/^          //' /tmp/release_body_2_4_0.md



          ASSETS=(

            "release-dl/scash-2.4.0-windows-release/scash-2.4.0-mid-world-core-30.4.0-win64-setup.exe"

            "release-dl/scash-2.4.0-windows-release/scash-2.4.0-mid-world-core-30.4.0-win64-setup.zip"

            "release-dl/scash-2.4.0-linux-release/scash-2.4.0-mid-world-core-30.4.0-x86_64-pc-linux-gnu.tgz"

          )

          for f in "${ASSETS[@]}"; do

            test -s "$f"

          done



          DRAFT_FLAG=()

          if [ "$IS_DRAFT" = "true" ]; then

            DRAFT_FLAG+=(--draft)

          fi



          if gh release view "$TAG" >/dev/null 2>&1; then

            gh release upload "$TAG" "${ASSETS[@]}" --clobber

            if [ "$IS_DRAFT" = "false" ]; then

              gh release edit "$TAG" --title "Scash 2.4.0" --notes-file /tmp/release_body_2_4_0.md --draft=false

            else

              gh release edit "$TAG" --title "Scash 2.4.0" --notes-file /tmp/release_body_2_4_0.md

            fi

          else

            gh release create "$TAG" "${ASSETS[@]}" \

              --target "$TARGET_BRANCH" \

              --title "Scash 2.4.0" \

              --notes-file /tmp/release_body_2_4_0.md \

              "${DRAFT_FLAG[@]}"

          fi
